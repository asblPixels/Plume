# Compilation automatique de Plume : Android (APK), iOS (IPA non signée),
# Flatpak, Snap. Sur un tag « v* », les fichiers sont joints à la Release.
name: Compilation

on:
  push:
    branches: [main, release/v1.4.1]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  linux-base:
    name: Linux (base pour Flatpak et Snap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Contrôle de version.json (mises à jour automatiques)
        run: node outils/version.js --check
      - name: Outils de paquets
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Application de bureau Linux
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node prepare.js
          npx electron-builder --linux dir snap AppImage deb rpm --x64 --publish never
          tar czf ../flatpak/plume-linux-x64.tar.gz -C dist/linux-unpacked .
          mkdir -p ../out && cp dist/*.snap dist/*.AppImage dist/*.deb dist/*.rpm ../out/
      - uses: actions/upload-artifact@v4
        with: { name: linux-tarball, path: flatpak/plume-linux-x64.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: linux-paquets, path: out/* }

  windows:
    environment: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'release-signing' || 'build-preview' }}
    name: Windows (installateur et portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Application Windows
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node prepare.js
          npx electron-builder --win dir --x64 --publish never
      - name: Trouver le compilateur NSIS
        id: nsis
        working-directory: desktop
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
            $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $nsis) {
              choco install nsis -y --force --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Installation NSIS impossible" }
              $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }
          if (-not $nsis) { throw "makensis.exe introuvable" }
          "path=$nsis" >> $env:GITHUB_OUTPUT
      - name: Installateur NSIS et version portable
        working-directory: desktop
        shell: pwsh
        env:
          PLUME_REQUIRE_SIGNED_RELEASE: ${{ vars.PLUME_REQUIRE_SIGNED_RELEASE }}
          PLUME_WINDOWS_PFX_B64: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && secrets.PLUME_WINDOWS_PFX_B64 || '' }}
          PLUME_WINDOWS_PFX_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && secrets.PLUME_WINDOWS_PFX_PASSWORD || '' }}
          PLUME_WINDOWS_CERT_SHA256: ${{ vars.PLUME_WINDOWS_CERT_SHA256 }}
          PLUME_NSIS_PATH: ${{ steps.nsis.outputs.path }}
        run: ./installer/build-windows.ps1 -Nsis $env:PLUME_NSIS_PATH
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  flatpak:
    name: Flatpak
    needs: linux-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-tarball, path: flatpak }
      - name: Installer Flatpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - name: Construire le paquet
        working-directory: flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build be.asblpixels.Plume.yml
          flatpak build-bundle repo Plume.flatpak be.asblpixels.Plume master
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: flatpak/Plume.flatpak, if-no-files-found: error }

  android:
    environment: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'release-signing' || 'build-preview' }}
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Projet Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node prepare-www.js
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0D1013' --iconBackgroundColorDark '#0D1013' --splashBackgroundColor '#0D1013' --splashBackgroundColorDark '#0D1013'
          node patch-android.js
          npx cap sync android
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "require('./package.json').version.split('.').reduce((n, part) => n * 100 + Number(part), 0)")
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle
      - name: Compilation et vérification de l’APK
        working-directory: mobile/android
        env:
          PLUME_REQUIRE_SIGNED_RELEASE: ${{ vars.PLUME_REQUIRE_SIGNED_RELEASE }}
          PLUME_ANDROID_KEYSTORE_B64: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && secrets.PLUME_ANDROID_KEYSTORE_B64 || '' }}
          PLUME_ANDROID_STORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && secrets.PLUME_ANDROID_STORE_PASSWORD || '' }}
          PLUME_ANDROID_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && secrets.PLUME_ANDROID_KEY_PASSWORD || '' }}
          PLUME_ANDROID_KEY_ALIAS: ${{ vars.PLUME_ANDROID_KEY_ALIAS }}
          PLUME_ANDROID_CERT_SHA256: ${{ vars.PLUME_ANDROID_CERT_SHA256 }}
        run: bash ../build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Construire les images disque Mac
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --no-audit --no-fund
          node prepare.js
          ICONSET=$(mktemp -d)/Plume.iconset
          mkdir "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" build/icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" build/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o build/icon.icns
          npx electron-builder --mac dmg --x64 --arm64 --publish never -c.artifactName='Plume-${version}-mac-${arch}.${ext}'
          for dmg in dist/*.dmg; do hdiutil verify "$dmg"; done
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: desktop/dist/*.dmg, if-no-files-found: error }

  ios:
    name: iOS (IPA non signée)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Projet iOS
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node prepare-www.js
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Plume" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Plume" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes array" $PL || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0 dict" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:CFBundleTypeName string Document" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSHandlerRank string Alternate" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes array" $PL
          i=0; for t in org.openxmlformats.wordprocessingml.document com.microsoft.word.doc org.oasis-open.opendocument.text public.rtf com.adobe.pdf public.plain-text net.daringfireball.markdown; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes:$i string $t" $PL; i=$((i+1)); done
      - name: Compilation (sans signature)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          VERSION=$(node -p "require('../../package.json').version")
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          mkdir -p ../../../out && zip -qry ../../../out/Plume-$VERSION-ios-non-signee.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/*.ipa }

  release:
    name: Publication dans la Release
    if: github.ref == 'refs/heads/release/v1.4.1'
    needs: [linux-base, windows, flatpak, android, ios, macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: actions/checkout@v4
      - name: Contrôler et publier les téléchargements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          test "$VERSION" = "1.4.1"
          rm dist/plume-linux-x64.tar.gz
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          for extension in exe zip AppImage deb rpm snap flatpak apk ipa dmg; do
            find dist -maxdepth 1 -name "*.$extension" -size +0 | grep .
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Plume $VERSION" --notes-file "docs/notes-de-version/v$VERSION.md"
