name: Plume 1.4.0 - paquet Windows et Linux
on:
  push:
    branches: [compat/word-roundtrip-audit]
    paths: [".github/workflows/publish-desktop-1.4.0.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Compile Windows EXE
        working-directory: desktop
        shell: pwsh
        run: |
          if ((node -p "require('./package.json').version") -ne "1.4.0") { throw "Version différente de 1.4.0" }
          npm ci --no-audit --no-fund
          node prepare.js
          npx electron-builder --win dir --x64 --publish never
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress | Out-Null }
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { throw "NSIS indisponible" }
          $d = (Get-Location).Path
          & $nsis "/DVERSION=1.4.0" "/DSRC=$d\dist\win-unpacked" "/DOUT=$d\dist\Plume-Setup-1.4.0-x64.exe" "/DICON=$d\build\icon.ico" installer\plume.nsi
          if ($LASTEXITCODE -ne 0) { throw "Erreur NSIS" }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item dist\Plume-Setup-1.4.0-x64.exe ..\out\
          Copy-Item -Recurse dist\win-unpacked Plume
          Compress-Archive -Path Plume -DestinationPath ..\out\Plume-Portable-1.4.0-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows-1.4.0, path: out/*, if-no-files-found: error }

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Dépendances
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm libfuse2
      - name: Build AppImage, DEB, RPM, SNAP
        working-directory: desktop
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.4.0"
          npm ci --no-audit --no-fund
          node prepare.js
          npx electron-builder --linux dir AppImage deb rpm snap --x64 --publish never
          mkdir -p ../out
          find dist -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.snap' \) -exec cp '{}' ../out/ \;
          for extension in AppImage deb rpm snap; do
            find ../out -maxdepth 1 -name "*.$extension" | grep -q . || exit 1
          done
          tar czf ../out/plume-linux-x64.tar.gz -C dist/linux-unpacked .
      - uses: actions/upload-artifact@v4
        with: { name: linux-1.4.0, path: out/*, if-no-files-found: error }

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-1.4.0, path: flatpak }
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Plume.flatpak
          manifest-path: flatpak/be.asblpixels.Plume.yml
          cache-key: flatpak-plume-1.4.0
      - uses: actions/upload-artifact@v4
        with: { name: flatpak-1.4.0, path: Plume.flatpak, if-no-files-found: error }

  release:
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows-1.4.0, path: publish }
      - uses: actions/download-artifact@v4
        with: { name: linux-1.4.0, path: publish }
      - uses: actions/download-artifact@v4
        with: { name: flatpak-1.4.0, path: publish }
      - name: Vérifier les fichiers
        run: |
          set -euo pipefail
          for e in exe zip AppImage deb rpm snap flatpak; do
            find publish -maxdepth 1 -name "*.$e" | grep -q . || exit 1
          done
          rm -f publish/plume-linux-x64.tar.gz
          sha256sum publish/* > publish/SHA256SUMS.txt
      - name: Publier Plume 1.4.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.4.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Plume 1.4.0" --notes "Plume 1.4.0 Windows et Linux. EXE non signé : Windows peut afficher SmartScreen."
          fi
          gh release upload v1.4.0 publish/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url: .url, files: [.assets[].name]}'
