name: Compatibilité DOCX (audit structurel)
on:
  pull_request:
    paths:
      - "js/docx-export.js"
      - "js/formats.js"
      - "js/pdf-editor.js"
      - "tests/pdf_editor.test.cjs"
      - "tests/pdf_native_real.test.cjs"
      - "tests/formats_word.test.cjs"
      - "tests/audit_docx_roundtrip.py"
      - "tests/test_audit_docx_roundtrip.py"
      - ".github/workflows/docx-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "tests/audit_docx_roundtrip.py"
      - "tests/test_audit_docx_roundtrip.py"
      - ".github/workflows/docx-compatibility.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-unitaire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la syntaxe JavaScript du moteur DOCX
        run: node --check js/docx-export.js && node --check js/formats.js && node --check js/pdf-editor.js
      - name: Tester la reconnaissance des formats Word
        run: node tests/formats_word.test.cjs
      - name: Tester la conservation et l'édition PDF
        run: node tests/pdf_editor.test.cjs && node tests/pdf_native_real.test.cjs
      - name: Vérifier les scripts Python
        run: python -m py_compile tests/audit_docx_roundtrip.py tests/test_audit_docx_roundtrip.py
      - name: Tester la validité OOXML et les pertes
        run: python -m unittest discover -s tests -p 'test_audit_docx_roundtrip.py' -v
