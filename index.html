<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plume — traitement de texte</title>
<meta name="description" content="Plume, le traitement de texte libre de Pixel's ASBL. Compatible .docx, fonctionne hors ligne sur Windows, macOS, Linux, Android et iOS.">
<meta name="theme-color" content="#0D1013">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plume">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/plume.css">
</head>
<body>

<!-- Barre de titre : logo, accès rapide, nom du document, recherche de commandes -->
<header id="titlebar">
  <svg id="logo" viewBox="0 0 512 512" aria-label="Plume"><use href="#plume-logo"/></svg>
  <div class="qat" id="qat"></div>
  <div id="docTitleWrap">
    <input id="docTitle" value="Document1" aria-label="Nom du document" spellcheck="false">
    <img class="app-name" src="icons/plume-wordmark-light.svg" alt="Plume" height="20">
    <span id="saveState"></span>
  </div>
  <div id="cmdSearchWrap">
    <span class="ic" data-icon="search"></span>
    <input id="cmdSearch" placeholder="Rechercher une commande (Alt+Q)" autocomplete="off" spellcheck="false">
    <div id="cmdResults" role="listbox"></div>
  </div>
  <button class="tb-btn" id="themeBtn" title="Thème clair / sombre"><span class="ic" data-icon="moon"></span></button>
</header>

<!-- Onglets + ruban (construits par js/ribbon.js) -->
<nav id="tabbar" role="tablist"></nav>
<section id="ribbon"></section>
<div id="infoBar" role="status" hidden></div>

<div id="rulerWrap"><div id="ruler"></div></div>

<div id="main">
  <aside id="navpane">
    <div class="np-head">Navigation <button class="tb-btn" style="color:inherit" id="npClose" title="Fermer"><span class="ic" data-icon="x"></span></button></div>
    <div class="np-search"><span class="ic" data-icon="search"></span><input id="npFind" placeholder="Rechercher dans le document"></div>
    <div class="np-tabs"><button data-np="titles" class="on">Titres</button><button data-np="results">Résultats</button><button data-np="comments">Commentaires</button></div>
    <div class="np-body" id="npBody"></div>
  </aside>

  <div id="canvas">
    <div id="zoomBox">
      <div id="sheet">
        <div id="pagesLayer"></div>
        <article id="editor" contenteditable="true" spellcheck="true" lang="fr-BE" aria-label="Document"></article>
        <div id="notesArea"></div>
        <div id="imgHandle"></div>
      </div>
    </div>
  </div>
  <button class="btn primary" id="exitReading">Quitter le mode Lecture</button>
</div>

<footer id="statusbar">
  <button class="sb" id="sbPage" title="Atteindre">Page 1 sur 1</button>
  <button class="sb" id="sbWords" title="Statistiques">0 mot</button>
  <button class="sb" id="sbLang" title="Langue de vérification">Français (Belgique)</button>
  <span class="grow"></span>
  <button class="sb" id="sbRead" title="Mode Lecture"><span class="ic" data-icon="book-open"></span></button>
  <button class="sb on" id="sbPrint" title="Page"><span class="ic" data-icon="file-text"></span></button>
  <button class="sb" id="zoomOut" title="Zoom arrière">−</button>
  <input type="range" id="zoomRange" min="25" max="300" step="5" value="100" aria-label="Zoom">
  <button class="sb" id="zoomIn" title="Zoom avant">+</button>
  <button class="sb" id="zoomPct" title="Zoom">100 %</button>
</footer>

<div id="mini"></div>
<div id="backstage"></div>
<div id="toast"></div>
<input type="file" id="fileInput">
<div id="printHeader" class="print-hf"></div>
<div id="printFooter" class="print-hf"></div>

<!-- Logo Plume : un P turquoise Pixel's -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="plGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="plume-logo" viewBox="0 0 512 512"><rect x="16" y="16" width="480" height="480" rx="112" fill="#0D1013"/><g transform="translate(256 256) scale(0.4 -0.4) translate(-328.5 -351.5)"><path d="M72 0V703H349Q416 703 469.5 676.0Q523 649 554.0 599.5Q585 550 585.0 482.0Q585 414 554.0 364.5Q523 315 469.5 288.0Q416 261 349 261H208V0ZM208 592V372H335Q367 372 393.0 385.0Q419 398 434.0 422.5Q449 447 449 482Q449 516 434.0 541.0Q419 566 393.0 579.0Q367 592 335 592Z" fill="#26EFC5" filter="url(#plGlow)"/></g></symbol>
  </defs>
</svg>

<script src="vendor/jszip.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/table-styles.js"></script>
<script src="js/docx-import.js"></script>
<script src="js/docx-export.js"></script>
<script src="js/embed-fonts.js"></script>
<script src="js/odt.js"></script>
<script src="js/rtf.js"></script>
<script src="js/markdown.js"></script>
<script src="js/legacy.js"></script>
<script src="js/formats.js"></script>
<script src="js/editor.js"></script>
<script src="js/ribbon.js"></script>
<script src="js/backstage.js"></script>
<script src="js/tools.js"></script>
<script src="js/ilots.js"></script>
<script src="js/native.js"></script>
<script src="js/app.js"></script>
</body>
</html>
